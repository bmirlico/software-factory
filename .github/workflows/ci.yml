name: CI
on:
  pull_request:
  push:
    branches: [main]
# The template repo itself has no stack: its Makefile targets fail on purpose, so CI is skipped there only.
jobs:
  check:
    if: github.repository != 'bmirlico/software-factory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: set up your stack (setup-python / setup-node / docker compose up -d ...)
      - run: make check
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # TODO: setup + `make dev` in the background
      - run: make e2e
